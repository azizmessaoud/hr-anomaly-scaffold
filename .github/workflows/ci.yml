name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[main,dev]'
      - name: Lint
        run: python -m ruff check app tests scripts
      - name: Type check
        run: python -m mypy app
      - name: Tests
        run: python -m pytest -q -m 'not integration'
