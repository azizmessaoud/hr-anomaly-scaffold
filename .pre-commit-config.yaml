repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.7, pydantic-settings>=2.3]
  - repo: local
    hooks:
      - id: pytest
        name: focused tests
        entry: python -m pytest -q -m 'not integration'
        language: system
        pass_filenames: false
